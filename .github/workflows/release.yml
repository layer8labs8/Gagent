name: Release

# Pushing a tag such as v0.1.0 builds the programs and attaches them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # ubuntu-22.04 has the oldest C library we support; the program runs on newer systems too.
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: List the libraries and their licenses
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          cargo metadata --format-version 1 --locked | "$PY" scripts/third_party.py > THIRD-PARTY-LICENSES.txt
          wc -l THIRD-PARTY-LICENSES.txt
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/Gagent
          cp target/release/gagent target/release/gagent-cli README.md LICENSE THIRD-PARTY-LICENSES.txt dist/Gagent/
          cp -r scripts dist/Gagent/
          tar -C dist -czf Gagent-${{ matrix.name }}.tar.gz Gagent
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/Gagent | Out-Null
          Copy-Item target/release/gagent.exe dist/Gagent/Gagent.exe
          Copy-Item target/release/gagent-cli.exe, README.md, LICENSE, THIRD-PARTY-LICENSES.txt dist/Gagent/
          Copy-Item -Recurse scripts dist/Gagent/scripts
          Compress-Archive -Path dist/Gagent -DestinationPath Gagent-${{ matrix.name }}.zip
          # The program on its own, for a one-click download.
          Copy-Item target/release/gagent.exe Gagent.exe
      - uses: actions/upload-artifact@v4
        with:
          name: gagent-${{ matrix.name }}
          path: |
            Gagent-${{ matrix.name }}.tar.gz
            Gagent-${{ matrix.name }}.zip
            Gagent.exe
          if-no-files-found: ignore
      - name: Keep one copy of the license list for the release page
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: THIRD-PARTY-LICENSES.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: true
          body: |
            **Windows:** download `Gagent.exe` and start it. The agent runs its commands with bash, which comes with
            [Git for Windows](https://git-scm.com) (`winget install Git.Git`). `Gagent-windows-x86_64.zip` also holds
            `gagent-cli.exe` and the install script.

            **Linux:** unpack `Gagent-linux-x86_64.tar.gz` and run `gagent`, or use `scripts/install-ubuntu.sh`.

            Open **Settings**, pick a service and paste your API key (see the README for where to get one).
            Checksums are in `SHA256SUMS.txt`. The libraries built into Gagent and their licenses are listed in
            `THIRD-PARTY-LICENSES.txt`. Gagent is free to use, not for sale: see `LICENSE`.
